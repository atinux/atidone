name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads `packageManager` for the pnpm version and installs the
      # dependencies, so there is no separate setup-node or install step.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
